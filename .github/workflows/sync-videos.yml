# 每天触发一次 EdgeOne 重新部署，让投稿数据保持最新。
#
# 为什么不在 GitHub 上直接同步了：
#   原来的做法是在这里跑 refresh_videos.py，但 GitHub 的 runner 是海外机房 IP，
#   被 B 站风控拦截，实测每天运行都失败（check annotation 里能看到
#   「B 站同步失败，已保留现有 videos.js」），videos.js 连续 5 天没更新。
#
#   所以改成：真正的同步放在 EdgeOne 的构建阶段执行（refresh-videos.mjs），
#   跑在腾讯国内网络，B 站访问正常。这个工作流只负责「按一下重新部署的按钮」。
#
# 需要在仓库里配置一个 Secret（不是变量）：
#   EDGEONE_DEPLOY_HOOK = EdgeOne 项目设置 → 部署钩子 里新建的 URL
# 没配的话这个工作流只会打印一条提示，不会报错。

name: 每日触发 EdgeOne 重新部署

on:
  schedule:
    # 每天 02:17 UTC = 北京时间 10:17（避开整点，减少排队延迟）
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 EdgeOne 部署
        env:
          HOOK: ${{ secrets.EDGEONE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::尚未配置 EDGEONE_DEPLOY_HOOK，本次跳过。"
            echo "配置方法：EdgeOne 项目设置 → 部署钩子 → 新建，把生成的 URL"
            echo "添加到本仓库 Settings → Secrets and variables → Actions，名字用 EDGEONE_DEPLOY_HOOK。"
            exit 0
          fi
          code=$(curl -sS -o hook.out -w '%{http_code}' -X POST --max-time 30 "$HOOK" || echo 000)
          echo "EdgeOne 返回 HTTP $code"
          [ -f hook.out ] && cat hook.out
          if [ "$code" = "000" ] || [ "$code" -ge 400 ]; then
            echo "::error::触发 EdgeOne 部署失败（HTTP $code）"
            exit 1
          fi
          echo "已触发，EdgeOne 会在构建阶段同步 B 站投稿并重新部署。"

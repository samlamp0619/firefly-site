<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="和萨姆萤光灯的 bot 聊聊天。" />
  <meta name="theme-color" content="#0d181c" />
  <title>在线对话 · 萨姆萤光灯</title>

  <script>
    (function () {
      var dark = true;
      try {
        var saved = localStorage.getItem("theme");
        if (saved) dark = saved === "dark";
      } catch (e) { /* 无 localStorage 时按默认深色走 */ }
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", dark ? "#0d181c" : "#fdf2ff");
    })();
  </script>

    <!-- 会话 Cookie 带 Secure 标记，只有 HTTPS 才保存。从 http:// 进来会「登录成功但没存下 Cookie」，
       所以这里强制跳一次。正式做法是在 EdgeOne 控制台开「强制 HTTPS」。 -->
  <script>
    if (location.protocol === "http:" && location.hostname !== "127.0.0.1" && location.hostname !== "localhost") {
      location.replace("https://" + location.host + location.pathname + location.search + location.hash);
    }
  </script>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="chat-page">

  <div class="chat-bg" aria-hidden="true"></div>

  <button type="button" class="sid-badge" id="sid-badge" title="登录 / 我的账号">
    <span class="sid-badge-label" id="sid-badge-label">登录</span>
    <b class="sid-badge-value" id="sid-badge-value" hidden>00000</b>
  </button>

  <header class="chat-top">
    <a class="chat-back" href="index.html">← 主页</a>
    <h1 class="chat-top-title">在线对话</h1>
    <nav class="page-nav" aria-label="站内导航">
      <a href="index.html#schedule">排期</a>
      <a href="index.html#projects">作品</a>
      <a href="community.html">社区 →</a>
    </nav>
  </header>

  <main class="chat-main">
    <div class="chat-card glass">

      <div class="chat-head">
        <span class="chat-status" id="chat-status">正在连接…</span>
        <span class="chat-quota" id="chat-quota"></span>
      </div>

      <div class="chat-log" id="chat-log" aria-live="polite"></div>

      <!-- 未登录 -->
      <p class="chat-login-tip" id="chat-login-tip">
        <a href="#" id="chat-login-link">登录</a> 之后就能和 bot 聊天啦～<br />
        <span class="chat-login-note">普通用户每天 15 条，认证（黄V）用户可以聊更多。</span>
      </p>

      <!-- 输入区 -->
      <form class="chat-form" id="chat-form" hidden>
        <input type="text" id="chat-input" maxlength="500" autocomplete="off"
          placeholder="说点什么…（Enter 发送）" />
        <button type="submit" class="btn btn-primary chat-send" id="chat-send">发送</button>
      </form>
    </div>
  </main>

  <!-- 账号弹窗已经收进 settings.html，这里只留左下角的状态灯，
       点它跳到设置页。会话状态由 auth.js 广播给社区 / 聊天模块。 -->

  <script defer src="auth.js"></script>
  <script defer src="chat.js"></script>
</body>
</html>
